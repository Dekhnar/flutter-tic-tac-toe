name: tic_tac_toe_app
description: Tic-tac-toe played online (Firestore), locally, or against an AI.

publish_to: "none"

version: 1.0.1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # Remote Storage
  firebase_core: ^4.2.0
  cloud_firestore: ^6.0.3

  # Translations
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Routing
  auto_route: ^10.2.4

  freezed_annotation: ^3.1.0

  clock: ^1.1.2
  firebase_auth: ^6.7.1
  share_plus: ^13.3.1
  firebase_crashlytics: ^5.4.1
  firebase_app_check: ^0.4.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.7.0
  auto_route_generator: ^10.2.4
  custom_lint: ^0.8.0
  riverpod_generator: ^3.0.3
  # 3.1 runs as an analyzer plugin and no longer under custom_lint.
  riverpod_lint: ">=3.0.3 <3.1.0"
  freezed: ^3.2.0
  fake_cloud_firestore: ^4.3.0
  alchemist: ^0.14.0
  integration_test:
    sdk: flutter
  fake_async: ^1.3.3

flutter:
  generate: true
  uses-material-design: true
  # One face: the medium styles render in Regular too, the look the goldens pin.
  fonts:
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-Regular.ttf
  config:
    enable-swift-package-manager: true
