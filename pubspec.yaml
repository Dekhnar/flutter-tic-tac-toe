name: tic_tac_toe_app
description: Tic-tac-toe played online (Firestore), locally, or against an AI.

publish_to: "none"

version: 1.0.1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Remote Storage
  firebase_core: ^4.2.0
  cloud_firestore: ^6.0.3

  # Translations
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  auto_route: 10.0.1

  # UI
  google_fonts: ^6.3.1

  freezed_annotation: ^3.1.0

  uuid: ^4.5.2
  clock: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.5.4
  auto_route_generator: 10.0.1
  custom_lint: ^0.7.5
  riverpod_generator: ^2.6.5
  riverpod_lint: ^2.6.5
  json_serializable: ^6.7.1
  freezed: ^3.1.0
  fake_cloud_firestore: ^4.0.0
  alchemist: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/google_fonts/

flutter_intl:
  enabled: true
  class_name: I18n
  arb_dir: lib/l10n
  output_dir: lib/generated
